<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a6bb5;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 24px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .priority-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      border: 2px solid transparent;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: #333;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #e74c3c;
    }

    .priority-select {
      padding: 10px 12px;
      font-size: 14px;
      border: 2px solid transparent;
      border-radius: 8px;
      outline: none;
      background: #fff;
      color: #333;
      cursor: pointer;
      flex-shrink: 0;
    }

    button.add-btn {
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      background: #fff;
      color: #1a6bb5;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }

    button.add-btn:hover {
      background: #fde;
    }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      margin-top: 4px;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-left: 5px solid #ccc;
      border-radius: 8px;
      padding: 12px 14px;
      transition: opacity 0.2s;
    }

    li.priority-high   { border-left-color: #e74c3c; }
    li.priority-medium { border-left-color: #e67e22; }
    li.priority-low    { border-left-color: #27ae60; }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1a6bb5;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info {
      flex: 1;
      min-width: 0;
    }

    li .task-text {
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }

    li .priority-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 7px;
      border-radius: 99px;
      margin-top: 4px;
    }

    .badge-high   { background: #fde8e8; color: #1a6bb5; }
    .badge-medium { background: #fef0e0; color: #b7620e; }
    .badge-low    { background: #e3f7ec; color: #1e8449; }

    li.done .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    li.done .priority-badge { opacity: 0.4; }

    li button.delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #ccc;
      font-size: 20px;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    li button.delete-btn:hover { color: #1a6bb5; }

    .empty {
      text-align: center;
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Todo</h1>
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Add a task..." autocomplete="off">
    </div>
    <div class="priority-row">
      <select class="priority-select" id="prioritySelect">
        <option value="high">High priority</option>
        <option value="medium" selected>Medium priority</option>
        <option value="low">Low priority</option>
      </select>
      <button class="add-btn" onclick="addTask()">Add</button>
    </div>
    <div class="section-label" id="sectionLabel" style="display:none">Tasks</div>
    <ul id="taskList"></ul>
    <p class="empty" id="emptyMsg">No tasks yet.</p>
  </div>

  <script>
    const input    = document.getElementById('taskInput');
    const list     = document.getElementById('taskList');
    const empty    = document.getElementById('emptyMsg');
    const priSel   = document.getElementById('prioritySelect');
    const secLabel = document.getElementById('sectionLabel');

    const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    function addTask() {
      const text = input.value.trim();
      if (!text) return;
      const priority = priSel.value;
      input.value = '';
      insertTask(text, priority);
      sync();
      input.focus();
    }

    function insertTask(text, priority) {
      const li = document.createElement('li');
      li.className = `priority-${priority}`;
      li.dataset.priority = priority;

      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.addEventListener('change', () => li.classList.toggle('done', cb.checked));

      const info = document.createElement('div');
      info.className = 'task-info';

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = text;

      const badge = document.createElement('span');
      badge.className = `priority-badge badge-${priority}`;
      badge.textContent = priority;

      info.append(span, document.createElement('br'), badge);

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.title = 'Delete';
      del.addEventListener('click', () => { li.remove(); sync(); });

      li.append(cb, info, del);

      // Insert in priority order
      const items = [...list.children];
      const insertBefore = items.find(
        item => PRIORITY_ORDER[item.dataset.priority] > PRIORITY_ORDER[priority]
      );
      if (insertBefore) list.insertBefore(li, insertBefore);
      else list.appendChild(li);
    }

    function sync() {
      const hasItems = list.children.length > 0;
      empty.style.display = hasItems ? 'none' : 'block';
      secLabel.style.display = hasItems ? 'block' : 'none';
    }

    sync();
  </script>
</body>
</html>
